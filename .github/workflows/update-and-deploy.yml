name: 更新高雄賽事並發布網站

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full:
        description: '同時重新讀取全市名單與全部 PDF（較慢）'
        type: boolean
        default: false
  schedule:
    # UTC；避開整點。賽會期間每 10 分鐘提出更新，GitHub 可能延後執行。
    - cron: '3,13,23,33,43,53 * * 9,10 *'

permissions:
  contents: read

concurrency:
  group: sport115-pages
  cancel-in-progress: false

jobs:
  season:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(date -u +%Y)" = "2026" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: season
    if: needs.season.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          # Rebase needs the shared history when main changes during scraping.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 安裝資料整理套件
        run: python -m pip install -r requirements.txt
      - name: 還原歷史賽程快取
        uses: actions/cache@v5
        with:
          path: .cache
          key: sport115-html-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sport115-html-v1-
      - name: 更新官方資料（失敗時保留舊資料並顯示提醒）
        id: sync
        continue-on-error: true
        env:
          FULL_REFRESH: ${{ inputs.full }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            python scripts/update.py --full
          else
            python scripts/update.py
          fi
      - name: 整合遠端更新、驗證並保存資料
        shell: bash
        env:
          DATA_BRANCH: ${{ github.ref_name }}
          GIT_EDITOR: 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/data
          if ! git diff --cached --quiet; then
            git commit -m '更新官方賽事資料與同步狀態'
          fi

          # Even an unchanged scrape must use the latest website before deployment.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/${DATA_BRANCH}"
            remote_head="$(git rev-parse FETCH_HEAD)"

            if ! git rebase "$remote_head"; then
              git rebase --abort
              # Only this runner's generated-data commit is discarded.
              # Keep the complete remote snapshot together with the remote code.
              git reset --hard "$remote_head"
              echo '::warning::遠端同時修改了資料，本次採用遠端完整版本；下次排程會重新擷取。'
            fi

            # Validate the exact combined version that will be pushed and deployed.
            python -m unittest discover -s tests -p 'test_*.py'
            node --test tests/app.test.cjs
            node --check site/app.js

            if git push origin "HEAD:refs/heads/${DATA_BRANCH}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::推送未成功，已停止發布。請查看上方訊息確認分支是否持續更新或有寫入權限限制。'
              exit 1
            fi
            echo "::notice::推送尚未成功，準備重新整合遠端版本（第 $((attempt + 1)) 次嘗試）。"
            sleep "$((attempt * 2))"
          done
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 記錄更新結果
        if: steps.sync.outcome == 'failure'
        run: echo '::warning::本次官網同步失敗；網站將顯示上次成功資料及更新提醒。'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
